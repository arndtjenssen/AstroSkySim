# AstroSkySim satellite configuration.
#
# Shared on purpose: this file is found by search, not named by each rig
# config, so one element download and one source list serve every sim.toml
# on the machine. Searched in order:
#
#   1. --satellites FILE
#   2. [satellites] config = "..." in the rig config
#   3. ./satellites.toml
#   4. ~/.config/astroskysim/satellites.toml
#
# Populate it with:  uv run astroskysim fetch-satellites

enabled = true

# Where fetch-satellites writes the element sets, and where a run reads them.
tle_dir = "~/.cache/astroskysim/tle"

# Warn when the elements are, in the median, older than this. SGP4 error grows
# about a kilometre a day in LEO - arcminutes of pointing - so stale elements
# put the trail in the wrong place rather than nowhere.
max_age_days = 14

# fetch-satellites leaves a file younger than this alone unless --force.
refetch_after_hours = 12

# Visual magnitude at 1000 km range and 90 deg phase, for a source that does
# not set its own. Everything downstream - range, phase angle, aperture, plate
# scale, filter, exposure - follows from the optics, so this is the only
# number describing the satellite itself.
default_std_mag = 6

# Draw only satellites the Sun is actually shining on. Turning this off is a
# test convenience, not a sky: nothing streaks in the Earth's shadow.
require_sunlit = true

# Cost knob. Every loaded object is propagated at every coarse step to find
# the few that cross the field; the search cone grows with the step, so a
# larger value is not obviously cheaper.
coarse_step_s = 5
max_satellites = 30000
timeout_s = 60

# --- sources ---------------------------------------------------------------
# One entry per element list, `enabled` being the tick box. Ticked lists are
# downloaded and put in the sky; the rest are here as a menu of what else
# Celestrak serves. std_mag is per list, which is coarse - it is an ordering
# (an ISS pass against a Starlink pass), not photometry.

# The ~170 brightest objects - the classic naked-eye list.
[[sources]]
group = "visual"
enabled = true
std_mag = 2.5

# ISS and CSS. Brighter than anything else up there; a pass through a sub is
# not subtle.
[[sources]]
group = "stations"
enabled = true
std_mag = -0.5

# ~8000 objects, and the reason this feature exists. Sun visors and dielectric
# mirrors put the v1.5/v2 mini standard magnitude near 6.
[[sources]]
group = "starlink"
enabled = true
std_mag = 5.9

# ~650 objects at 1200 km: slower across the frame than Starlink, and fainter
# for the range.
[[sources]]
group = "oneweb"
enabled = true
std_mag = 7

# Hubble, Swift and company. Few, and mostly faint.
[[sources]]
group = "science"
enabled = true
std_mag = 5

# Everything operational, ~12000 objects. A superset of most lists below -
# tick this *instead of* them, not as well.
[[sources]]
group = "active"
enabled = false
std_mag = 6

# Recent launches, often still flying in a train.
[[sources]]
group = "last-30-days"
enabled = false
std_mag = 6

# Chinese LEO broadband, growing fast.
[[sources]]
group = "qianfan"
enabled = true
std_mag = 6.5

# Chinese Beidou
[[sources]]
group = "beidou"
enabled = true
std_mag = 6.5


# Amazon's constellation.
[[sources]]
group = "kuiper"
enabled = true
std_mag = 6.5

# The flaring Block 1 satellites are all deorbited; these do not flare.
[[sources]]
group = "iridium-NEXT"
enabled = false
std_mag = 6.5

[[sources]]
group = "globalstar"
enabled = false
std_mag = 6

[[sources]]
group = "orbcomm"
enabled = false
std_mag = 6.5

[[sources]]
group = "swarm"
enabled = false
std_mag = 8

[[sources]]
group = "amateur"
enabled = false
std_mag = 6.5

[[sources]]
group = "cubesat"
enabled = false
std_mag = 8

[[sources]]
group = "weather"
enabled = false
std_mag = 5

[[sources]]
group = "noaa"
enabled = false
std_mag = 5

[[sources]]
group = "resource"
enabled = false
std_mag = 6

[[sources]]
group = "planet"
enabled = false
std_mag = 7.5

[[sources]]
group = "spire"
enabled = false
std_mag = 8

# Geostationary. These do not race across the frame - they sit still over the
# ground and so drift at the sidereal rate against the stars, drawing a short
# trail in a long sub rather than a long one.
[[sources]]
group = "geo"
enabled = false
std_mag = 8

# All navigation constellations.
[[sources]]
group = "gnss"
enabled = true
std_mag = 6.5

[[sources]]
group = "gps-ops"
enabled = true
std_mag = 6.5

[[sources]]
group = "galileo"
enabled = true
std_mag = 6.5

[[sources]]
group = "military"
enabled = false
std_mag = 6

[[sources]]
group = "radar"
enabled = false
std_mag = 6

# Debris: thousands of objects, all faint. A fair stress test of the
# propagation budget.
[[sources]]
group = "cosmos-2251-debris"
enabled = false
std_mag = 9

[[sources]]
group = "fengyun-1c-debris"
enabled = false
std_mag = 9

# Any URL serving two-line elements works, not just Celestrak. A `url` entry
# needs a `name`, which is what its cache file is called.
[[sources]]
name = "amsat"
url = "https://www.amsat.org/amsat/ftp/keps/current/nasabare.txt"
enabled = false
std_mag = 7
