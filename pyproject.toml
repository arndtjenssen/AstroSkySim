[project]
name = "astroskysim"
version = "0.1.0"
description = "Headless INDI telescope/camera simulator with artificial and DSS sky sources"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["astronomy", "indi", "astrophotography", "simulator", "telescope"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.24",
    "astropy>=5.3",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pillow>=10.0",
]

[project.optional-dependencies]
# DSS survey fetching. Kept optional so the artificial sky works with no network stack.
dss = [
    "reproject>=0.13",
    "astroquery>=0.4.7",
]

[project.scripts]
astroskysim = "astroskysim.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astroskysim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
